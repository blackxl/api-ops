# api-ops production compose for a small host (about 1.9 GiB available).
#
# Image: ghcr.io/blackxl/api-ops:latest
# Published by .github/workflows/ci.yml on push to main only, linux/amd64.
# Immutable tag alongside it: ghcr.io/blackxl/api-ops:sha-<full git sha>
# This file does not claim that tag already exists in GHCR. Pull fails
# until the first successful main publish.
#
# Host HTTP is bound to 127.0.0.1 only. Put BaoTa / nginx in front.
# Postgres and Redis have no host ports. Secrets come from .env, never from git.
#
# Usage (on the server, after the image has been published):
#   cp .env.production.example .env   # then fill PLEASE_FILL_* in the panel
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: api-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api_ops
      POSTGRES_PASSWORD: ${OPS_PG_PASSWORD:?set OPS_PG_PASSWORD in .env}
      POSTGRES_DB: api_ops
    volumes:
      - api-ops-pg:/var/lib/postgresql/data
    networks:
      - api-ops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    mem_reservation: 96m
    memswap_limit: 320m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: api-ops-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - api-ops-redis:/data
    networks:
      - api-ops-net
    mem_limit: 80m
    mem_reservation: 24m
    memswap_limit: 80m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/blackxl/api-ops:latest
    platform: linux/amd64
    pull_policy: always
    container_name: api-ops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    environment:
      OPS_DB_DSN: host=postgres port=5432 user=api_ops password=${OPS_PG_PASSWORD:?set OPS_PG_PASSWORD in .env} dbname=api_ops sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: redis:6379
      GIN_MODE: release
      SEED_ON_START: "false"
    volumes:
      - api-ops-billing-exports:/data/billing-exports
    networks:
      - api-ops-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 720m
    mem_reservation: 128m
    memswap_limit: 720m
    cpus: 1.50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-ops-pg:
  api-ops-redis:
  api-ops-billing-exports:

networks:
  api-ops-net:
    driver: bridge
