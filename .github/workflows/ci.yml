# api-ops CI
#
# Jobs:
#   1) lint    —— go vet ./... + gofmt -l
#   2) test    —— go test -race -coverprofile=coverage.out ./...
#   3) build   —— CGO_ENABLED=0 go build ./cmd/server
#   4) docker  —— build linux/amd64 image and smoke-test. Never pushes.
#   5) publish —— push to ghcr.io only on a push to main.
#                 Tags: :latest and :sha-<full commit>.
#                 Pull requests never run this job, so they cannot move :latest.
#
# Trigger: push to main / pull_request to main
# Runner: ubuntu-latest + Go 1.22
# Coverage: upload to codecov (optional; missing CODECOV_TOKEN does not fail CI)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (vet + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未格式化:"
            echo "$UNFORMATTED"
            exit 1
          fi

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: 覆盖率阈值断言
        # 本项目 (api-ops 脱敏版) 大部分 handler 走 DB 集成测试, 单测覆盖率天然低
        # 软警告阈值降到 5% (因为没有 cmd/seed mock 套件, 大量函数仅在集成测试覆盖)
        # CI 不因覆盖率 fail, 留给 PR 模板人工 review
        run: |
          go tool cover -func=coverage.out | tail -1
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${PCT}%"
          if [ -n "$PCT" ]; then
            if awk "BEGIN{exit !($PCT < 5)}"; then
              echo "::warning::Total coverage ${PCT}% < 5% target (软警告, CI 不会 fail)"
            fi
          fi

      - name: 上传 coverage 到 Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build (cmd/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go build (static, CGO disabled)
        run: CGO_ENABLED=0 go build -o /tmp/server ./cmd/server

      - name: 校验二进制可启动
        run: |
          # 不连 DB 启动会失败（缺 OPS_DB_DSN），但能确认编译 + flag 解析 OK
          /tmp/server --help 2>&1 | head -5 || echo "(server 无 --help flag，正常)"

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Build linux/amd64 image
        run: |
          set -eu
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker build --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            -t api-ops:ci .

      - name: Image identity, wget, and export directory
        run: |
          set -eu
          docker run --rm --entrypoint /bin/sh api-ops:ci -c '
            set -eu
            id
            test "$(id -u)" = "100"
            test "$(id -g)" = "101"
            command -v wget
            wget --help 2>&1 | grep -q -- --spider
            test -d /data/billing-exports
            test -w /data/billing-exports
            touch /data/billing-exports/.write-probe
            test -f /app/web/dist/index.html
            test -f /app/internal/billing/templates/statement.html
            test -x /app/api-ops-server
          '

      - name: Fresh named volume is writable by uid 100
        run: |
          set -eu
          vol="api-ops-ci-exports-${GITHUB_RUN_ID}"
          docker volume rm "$vol" >/dev/null 2>&1 || true
          docker run --rm -v "${vol}:/data/billing-exports" --entrypoint /bin/sh api-ops:ci \
            -c 'touch /data/billing-exports/.volume-probe && ls -ln /data/billing-exports/.volume-probe'
          docker volume rm "$vol"

      - name: healthz via BusyBox wget
        run: |
          set -eu
          docker rm -f ci-api ci-pg >/dev/null 2>&1 || true
          docker run -d --name ci-pg \
            -e POSTGRES_USER=api_ops \
            -e POSTGRES_PASSWORD=ci_only_not_a_secret \
            -e POSTGRES_DB=api_ops \
            postgres:15-alpine
          # Official postgres entrypoint accepts, restarts once, then accepts
          # again. One pg_isready success can be followed by "rejecting
          # connections". Require three successes in a row before continuing.
          streak=0
          for i in $(seq 1 40); do
            if docker exec ci-pg pg_isready -U api_ops >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then
                break
              fi
            else
              streak=0
            fi
            sleep 1
          done
          if [ "$streak" -lt 3 ]; then
            echo "postgres did not stay ready"
            docker logs ci-pg || true
            exit 1
          fi
          # Share the Postgres network namespace so 127.0.0.1 works without
          # publishing a host port. Throwaway password, not a production secret.
          docker run -d --name ci-api --network container:ci-pg \
            --cap-drop ALL --security-opt no-new-privileges \
            -e OPS_DB_DSN='host=127.0.0.1 port=5432 user=api_ops password=ci_only_not_a_secret dbname=api_ops sslmode=disable TimeZone=Asia/Shanghai' \
            -e OPS_API_TOKEN='0123456789abcdef0123456789abcdef' \
            -e JWT_SECRET='0123456789abcdef0123456789abcdef' \
            -e ADMIN_PASSWORD='ci-admin-password' \
            -e GIN_MODE=release \
            -e SEED_ON_START=false \
            api-ops:ci
          ok=0
          for i in $(seq 1 40); do
            if docker exec ci-api wget -q --spider -T 3 http://127.0.0.1:8088/healthz; then
              ok=1
              break
            fi
            sleep 2
          done
          echo "---- api logs ----"
          docker logs ci-api || true
          docker rm -f ci-api ci-pg >/dev/null 2>&1 || true
          test "$ok" = "1"

  publish:
    name: Publish GHCR (main only)
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    # Push events to main only. pull_request never matches, so :latest cannot move from a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build linux/amd64 image
        run: |
          set -eu
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          sha_tag="ghcr.io/blackxl/api-ops:sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            -t "${sha_tag}" \
            -t ghcr.io/blackxl/api-ops:latest .

      - name: Push immutable sha tag, then latest
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          sha_tag="ghcr.io/blackxl/api-ops:sha-${GITHUB_SHA}"
          docker push "${sha_tag}"
          docker push ghcr.io/blackxl/api-ops:latest
          docker image inspect --format '{{json .RepoDigests}}' "${sha_tag}"
          echo "Pushed ${sha_tag} and ghcr.io/blackxl/api-ops:latest"